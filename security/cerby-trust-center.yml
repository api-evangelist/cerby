certifications: []
certifications_note: >-
  DELIBERATELY EMPTY. No certification is attributed to Cerby because none could
  be verified. This is the trap on this provider and it is worth stating plainly:
  https://www.cerby.com/security returns 200 and does name SOC 2 Type I, SOC 2
  Type II and ISO 27001 — but its section 1 is titled "CLOUD PROVIDER's Audits &
  Certifications", and section 1.1 reads "Cerby currently relies on its Cloud
  Provider's third-party reviewed Security Program". Section 1.3 goes further:
  "To the extent Cerby does not obtain a Third-Party Audit of its own, Cerby will
  adopt or maintain ... an equivalent, industry-recognized framework" — the
  document explicitly contemplates Cerby having no audit of its own. Harvesting
  those certification names would attribute a subprocessor's attestations to
  Cerby. They are recorded below as what they are.
