aid: cerby
name: Cerby
description: Cerby is an identity, access, and password management platform for nonfederated and disconnected
  applications — the enterprise software that does not support SAML, SCIM, or an integration API of its
  own. Cerby extends existing IAM, IGA, and PAM systems to those applications through browser and robotic
  automation, adding provisioning and deprovisioning, credential rotation, MFA enrollment, and access
  governance where no standards-based integration exists. Cerby publishes a public RESTful API (JSON:API-style
  envelope, X-API-Key authentication, scoped API keys) over eight resources — accounts, secrets, collections,
  users, teams, integrations, jobs, and vaults — plus a signed webhook notification service, a cross-platform
  CLI, and SCIM 2.0 endpoints for provisioning from Okta, Entra ID, and OneLogin.
