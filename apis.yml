- aid: cerby:cerby-api
  name: Cerby API
  description: The public Cerby REST API. Programmatic access to accounts, secrets, collections, users,
    teams, integrations, jobs, and vaults in a Cerby workspace. Requests are authenticated with a scoped
    API key sent in the X-API-Key header; responses use a JSON:API-style envelope of data, links, and
    meta objects with page[number]/page[size] pagination, filter[...] filtering, and sort ordering.
