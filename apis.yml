- aid: cerby:cerby-scim
  name: Cerby SCIM 2.0
  description: Cerby exposes SCIM 2.0 endpoints so an identity provider can automatically provision and
    deprovision users and groups into a Cerby workspace. Documented for Okta, Microsoft Entra ID, and
    OneLogin, authenticated with a SCIM API token generated and rotated from the Cerby web app.
  humanURL: https://help.cerby.com/setup-and-admin/workspace-identity-federation/retrieve-the-scim-api-authentication-token-from-cerby
