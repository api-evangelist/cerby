  sunset_header: not documented
  deprecation_header: not documented
  detail: >-
    Cerby publishes no formal deprecation or sunset policy, and no RFC 8594
    Sunset/Deprecation header support is documented. Change is communicated
    through the dated API release notes only. The 2026-05-25 entry changed the
    semantics of the existing /v1/search last_used filter buckets in place, with
    a note telling external integrators to verify their result sets — announced,
    but not versioned and not deprecation-managed.
  nearest_equivalent:
    mechanism: reserved and provisional event types
    detail: >-
      On the webhook surface Cerby publishes a forward-looking equivalent: four
      RESERVED event types that return HTTP 400 on subscription until released,
      and five PROVISIONAL event types defined in the catalog without a
      confirmed emitter. It manages the not-yet-shipped edge explicitly while
      leaving the being-removed edge unaddressed.
  reserved_event_types:
