generated: '2026-08-09'
method: searched
source: https://help.cerby.com/developer-tools/cerby-webhooks/implement-a-webhook-receiver
scope: >-
  Automation failure codes carried on the `automation.failed` webhook event.
  These are the non-payments sibling of a decline-code registry: Cerby drives
  provisioning and credential rotation by automating third-party applications,
  and this is the published vocabulary for why an automation did not complete.
  Distinct from errors/cerby-problem-types.yml, which covers API-level errors.
delivery:
  event_type: automation.failed
  note: >-
    All automation failures share one event type. The specific failure is
    identified by error.code, not by the event type. Individual error codes are
    not separately subscribable.
envelope:
  field: error
  fields:
    code:
      type: string
      description: Stable machine identifier. Treat unrecognized values as opaque generic failures.
    message:
      type: string or null
      description: Human-readable description. May be null. Do not rely on its exact wording.
    user_action:
      type: string or null
      description: >-
        Coarse remediation category. Null or unknown values should be treated as
        "review in Cerby".
  remediation_field:
    field: data.remediation
    note: >-
      Only NotEnoughSeats populates data.remediation with machine-readable
      detail in this release. All other codes deliver data.remediation as null.
tiers:
  '0': >-
    Failures that must be remediated outside Cerby, in the target application,
    before the automation is retried.
  '1': Credential and vault problems with the stored account.
  '2': Contact-information and MFA configuration problems.
  '3': Trusted-session / device problems.
codes:
